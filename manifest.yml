# Tether: Forge app manifest.
# app.id is a placeholder until the app OWNER runs `forge register` once (see docs/TEAM-SETUP.md).
# Changing scopes, `llm`, or adding Confluence/Jira products = major version: reinstall with
# `forge install --upgrade` on your dev site.
app:
  id: ari:cloud:ecosystem::app/07520459-db83-4ab5-b000-09c3c8095691
  runtime:
    name: nodejs22.x
    memoryMB: 512
    architecture: arm64

modules:
  # ---------------------------------------------------------------- Jira UI
  jira:issuePanel:
    - key: tether-issue-panel
      resource: report-ui
      resolver:
        function: resolver
      title: Tether decision check
      icon: resource:report-ui;tether.svg
  jira:adminPage:
    - key: tether-admin
      resource: report-ui
      resolver:
        function: resolver
      title: Tether settings

  # ---------------------------------------------------------------- async analysis
  consumer:
    - key: tether-analysis-consumer
      queue: tether-analysis
      function: worker

  # ---------------------------------------------------------------- drift detection
  trigger:
    - key: tether-decision-updated
      function: on-decision-updated
      events:
        - avi:confluence:updated:page
    - key: tether-issue-updated
      function: on-issue-updated
      events:
        - avi:jira:updated:issue

  # ---------------------------------------------------------------- eval (dev only)
  webtrigger:
    - key: tether-eval-runner
      function: eval-runner
      response:
        type: dynamic

  # ---------------------------------------------------------------- Rovo / MCP
  # One set of actions, three surfaces: the Tether agent, a reusable skill, and MCP tools.
  action:
    - key: check-issue-consistency
      name: Check issue against decisions
      function: action-check
      actionVerb: GET
      description: >
        Checks if a Jira issue's technical requirements contradict current
        engineering decisions in Confluence. Returns CONFLICT, NEEDS_REVIEW,
        NO_CONFLICT_FOUND or INSUFFICIENT_EVIDENCE with coverage and verbatim,
        linked evidence.
      inputs:
        issueKey:
          title: Jira issue key
          type: string
          required: false
          description: The Jira issue key, for example PAY-142. Optional when used from an
            issue.
    - key: find-decisions
      name: Find engineering decisions
      function: action-find
      actionVerb: GET
      description: >
        Lists engineering decision records (ADRs) from the configured Confluence
        spaces with status, service, scope, supersession and links. Answers
        "what did we decide about X?".
      inputs:
        query:
          title: Search text
          type: string
          required: false
          description: Optional text to filter decisions, for example "retry" or
            "payment-service".
    - key: create-follow-up-issue
      name: Create clarification issue
      function: action-follow-up
      actionVerb: CREATE
      description: >
        Creates a Jira clarification issue for a conflict found by
        check-issue-consistency, linked to the checked issue and the decision
        pages. Never edits either.
      inputs:
        issueKey:
          title: Jira issue key
          type: string
          required: true
          description: The issue that was checked, for example PAY-142.
        findingId:
          title: Finding id
          type: string
          required: false
          description: Finding id from the check result. Defaults to the first conflict.
  rovo:skill:
    - key: decision-consistency
      source:
        dir: skills/decision-consistency
      dependencies:
        tools:
          - check-issue-consistency
          - find-decisions
  rovo:agent:
    - key: tether-agent
      name: Tether
      description: Checks Jira work against your team's engineering decisions in
        Confluence, with evidence.
      icon: resource:report-ui;tether.svg
      prompt: resource:agent-prompts;tether-agent.md
      conversationStarters:
        - Does this issue conflict with any engineering decision?
        - What did we decide about payment retries?
        - Which decisions apply to the payment service?
      actions:
        - check-issue-consistency
        - find-decisions
        - create-follow-up-issue
      skills:
        - decision-consistency
  rovo:mcp:
    - key: tether-mcp
      name: Tether
      tools:
        - check-issue-consistency
        - find-decisions

  # ---------------------------------------------------------------- AI
  llm:
    - key: tether-llm
      model:
        - claude

  # ---------------------------------------------------------------- functions
  function:
    - key: resolver
      handler: index.resolverHandler
    - key: worker
      handler: index.workerHandler
      timeoutSeconds: 900
    - key: on-decision-updated
      handler: index.onDecisionUpdated
    - key: on-issue-updated
      handler: index.onIssueUpdated
    - key: eval-runner
      handler: index.evalHandler
    - key: action-check
      handler: index.checkIssueConsistency
    - key: action-find
      handler: index.findDecisions
    - key: action-follow-up
      handler: index.createFollowUp

resources:
  - key: report-ui
    path: static/report/build
    tunnel:
      port: 5173
  - key: agent-prompts
    path: prompts

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
    - read:confluence-content.all
    - read:confluence-content.summary
    - read:confluence-space.summary
    - read:confluence-content.permission
    - search:confluence
    # Teamwork Graph (Preview). Week-1 task for integration: uncomment, deploy to YOUR
    # environment, confirm deploy + queries work, then commit. Missing scopes make graph
    # queries return EMPTY (not errors); Tether reports that as "graph unavailable".
    # - read:graph:issue:jira
    # - read:graph:issue-remote-link:jira
    # - read:graph:page:confluence
    # - read:graph:user:atlassian
    # - read:graph:team:atlassian
