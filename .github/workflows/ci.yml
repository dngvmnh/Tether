name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/report/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval:offline
      - run: npm run manifest:check
      - run: npm run ui:build
      - name: Fixtures are up to date
        run: |
          npm run fixtures
          git diff --exit-code static/report/src/mocks/reports.json || (echo "Run 'npm run fixtures' and commit the result" && exit 1)
